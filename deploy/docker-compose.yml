services:
  haolaile-server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: haolaile-server
    restart: unless-stopped
    env_file:
      - ../server/.env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3000"
